# WiFi YFP dashboard: static web app from ./web, API proxied to the api service.
# No TLS (internal network, by decision); the previous single-file dashboard stays
# reachable at /legacy/ for comparison until the new front end is accepted.
upstream wifi_api {
    # No upstream keepalive: with it, small API responses stalled ~40 ms (Nagle / delayed ACK).
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/x-ndjson text/markdown text/plain image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ── Static web app ──
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;         # revalidate (ETag): new code shows up after deploy
        add_header X-Content-Type-Options nosniff always;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;   # versioned file names
        add_header X-Content-Type-Options nosniff always;
    }

    # ── Previous dashboard (served by the API) ──
    location = /legacy/ {
        proxy_pass http://wifi_api/;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://wifi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout 200s;        # AI summaries can take up to 3 minutes
    }
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://wifi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }
}
