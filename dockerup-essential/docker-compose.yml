services:
  postgres:
    image: postgres:16-alpine
    container_name: wifitest-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=120
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: wifitest
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qcpass
    volumes:
      - ${STORAGE_PATH:-/mnt/md127/WIFI_YFP_DashBoard}/docker-data/pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d wifitest"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana-init:
    image: alpine:latest
    user: root
    volumes:
      - ${STORAGE_PATH:-/mnt/md127/WIFI_YFP_DashBoard}/docker-data/grafana-data:/var/lib/grafana
    command: sh -c "chown -R 472:472 /var/lib/grafana && chmod 755 /var/lib/grafana"
    restart: "no"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: wifitest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ${STORAGE_PATH:-/mnt/md127/WIFI_YFP_DashBoard}/docker-data/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    build:
      context: .                  # api/ plus the shared log_parser.py and the dashboard HTML
      dockerfile: api/Dockerfile
    image: wifitest-api:${APP_VERSION:-0.2.0}
    container_name: wifitest-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://qc:qcpass@postgres/wifitest
      PYTHONUNBUFFERED: "1"
      APP_VERSION: ${APP_VERSION:-0.2.0}
      TWEAK_USER: ${TWEAK_USER:-}                 # administrator login (DB maintenance, accounts, every upload); unset = no admin
      TWEAK_PASS: ${TWEAK_PASS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      UPLOAD_TMP_DIR: /app/uploads                # web upload temp files (cleared after each commit)
      LLM_API_BASE: ${LLM_API_BASE:-http://10.20.30.23:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-tn8227}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-35B-A3B-Q6_K}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}   # off: same report ~3× faster
      LLM_REPORT_MAX_TOKENS: ${LLM_REPORT_MAX_TOKENS:-1024}
      REPORT_AUTO: ${REPORT_AUTO:-true}                   # pre-generate AI reports in the background
      REPORT_WARM_LATEST: ${REPORT_WARM_LATEST:-30}       # newest N work orders kept ready (both languages)
      STATS_REFRESH_SEC: ${STATS_REFRESH_SEC:-300}   # mv_unit refresh interval (also refreshed after ingest/deletes)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs          # batch-ingest folder (docker exec … log_parser.py /app/logs)
      - ./WiFiTestLogs:/app/WiFiTestLogs
      - ${STORAGE_PATH:-/mnt/md127/WIFI_YFP_DashBoard}/docker-data/app-logs:/app/runtime-logs
      - ${STORAGE_PATH:-/mnt/md127/WIFI_YFP_DashBoard}/docker-data/uploads:/app/uploads
    # Code is baked into the image. For development mount the sources instead:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    expose:
      - "8000"                    # reached through nginx on :8000, not published directly
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: wifitest-nginx
    restart: unless-stopped
    ports:
      - "${WIFI_HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro      # static web/ + /api/ proxy (no TLS: internal network)
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

# ── Usage ──────────────────────────────────────────────────────────────────────
# 1. Start stack:        docker-compose up -d
# 2. Init schema:        (auto-applied on first postgres start)
# 3. Batch ingest:       docker exec wifitest-api python log_parser.py /app/logs --dsn postgresql://qc:qcpass@postgres/wifitest
# 4. Open dashboard:     http://localhost:3000  (admin / admin)
# 5. Add data source:    Grafana > Connections > PostgreSQL > host=postgres:5432 db=wifitest
# 6. Upload GUI:         Open wifi_dashboard.html in browser (connect to API at :8000)
