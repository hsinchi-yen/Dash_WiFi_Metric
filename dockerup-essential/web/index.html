<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi YFP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a84ff'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ETN%3C/text%3E%3C/svg%3E">
<script>
    // Apply the saved theme before first paint (no flash). Dark is the default.
    try { document.documentElement.dataset.theme = localStorage.getItem('wifi-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<script src="vendor/chart.umd-4.4.1.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">

<!-- ═══ Sidebar ═══ -->
<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">TN</div>
        <div>
            <div class="brand-name">WiFi YFP</div>
            <div class="brand-sub" data-i18n="app.sub"></div>
        </div>
    </div>
    <div class="clock">
        <div class="clock-time num" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate"></div>
    </div>
    <nav class="nav" data-i18n-aria="nav.aria">
        <div class="nav-label" data-i18n="nav.groupOverview"></div>
        <a class="nav-item" href="#overview" data-page="overview"><span class="nav-icon">📊</span><span data-i18n="nav.overview"></span></a>
        <a class="nav-item" href="#workorders" data-page="workorders"><span class="nav-icon">📋</span><span data-i18n="nav.workorders"></span></a>
        <a class="nav-item" href="#fails" data-page="fails"><span class="nav-icon">⚠️</span><span data-i18n="nav.fails"></span></a>
        <a class="nav-item" href="#reports" data-page="reports"><span class="nav-icon">🗓️</span><span data-i18n="nav.reports"></span></a>
        <div class="nav-label" data-i18n="nav.groupAnalysis"></div>
        <a class="nav-item" href="#rf" data-page="rf"><span class="nav-icon">📡</span><span data-i18n="nav.rf"></span></a>
        <a class="nav-item" href="#production" data-page="production"><span class="nav-icon">⚡</span><span data-i18n="nav.production"></span></a>
        <div class="nav-label" data-i18n="nav.groupManage"></div>
        <a class="nav-item" href="#logupload" data-page="logupload"><span class="nav-icon">📤</span><span data-i18n="nav.logupload"></span></a>
        <a class="nav-item" href="#products" data-page="products"><span class="nav-icon">🏷️</span><span data-i18n="nav.products"></span></a>
        <a class="nav-item" href="#dbtweak" data-page="dbtweak" title="DB Tweak"><span class="nav-icon">🔧</span><span data-i18n="nav.dbtweak"></span></a>
        <a class="nav-item" href="#accounts" data-page="accounts" data-admin-only><span class="nav-icon">👥</span><span data-i18n="nav.accounts"></span></a>
        <a class="nav-item" href="#rd" data-page="rd" data-rd-only><span class="nav-icon">🔬</span><span data-i18n="nav.rd"></span></a>
        <a class="nav-item" href="#settings" data-page="settings" data-admin-only><span class="nav-icon">⚙️</span><span data-i18n="nav.settings"></span></a>
    </nav>
    <div class="sidebar-foot">
        <div class="auth-box" id="authBox" hidden>
            <div class="auth-name" id="authName"></div>
            <div class="auth-role" id="authRole"></div>
            <div class="auth-actions">
                <button class="btn small" type="button" id="btnChangePw" data-i18n="auth.changePwBtn"></button>
                <button class="btn small" type="button" id="btnLogout" data-i18n="auth.logout"></button>
            </div>
        </div>
        <div class="prefs">
            <button class="btn small" type="button" id="btnTheme" data-i18n-aria="theme.aria"></button>
            <button class="btn small" type="button" id="btnLang" data-i18n="lang.switch" data-i18n-aria="lang.aria"></button>
        </div>
        <div class="status-row"><span class="dot wait" id="apiDot"></span><span id="apiText" data-i18n="status.api"></span></div>
        <div class="status-row"><span class="dot wait" id="llmDot"></span><span id="llmText" data-i18n="status.llm"></span></div>
    </div>
</aside>

<!-- ═══ Main ═══ -->
<main class="main">
    <div class="top-stack">
    <header class="topbar">
        <div class="page-head">
            <h1 class="page-title" id="pageTitle"></h1>
            <span class="page-scope" id="pageScope"></span>
            <div class="seg" role="group" id="ovViewSeg" data-i18n-aria="fc.viewAria" hidden>
                <button type="button" data-view="trend" data-i18n="fc.viewTrend"></button>
                <button type="button" data-view="forecast" data-i18n="fc.viewForecast"></button>
            </div>
        </div>
        <div class="topbar-spacer"></div>
        <div class="filters" id="filterBar" hidden>
            <div class="seg" role="group" id="rangeSeg" data-i18n-aria="filter.rangeAria">
                <button type="button" data-range="all" data-i18n="filter.all"></button>
                <button type="button" data-range="today" data-i18n="filter.today"></button>
                <button type="button" data-range="week" data-i18n="filter.week"></button>
                <button type="button" data-range="month" data-i18n="filter.month"></button>
                <button type="button" data-range="custom" data-i18n="filter.custom"></button>
            </div>
            <span id="customRange" hidden>
                <input type="date" class="input" id="dateFrom" data-i18n-aria="filter.from">
                <span class="muted">~</span>
                <input type="date" class="input" id="dateTo" data-i18n-aria="filter.to">
            </span>
            <select class="select" id="productSelect" data-i18n-aria="filter.productAria"></select>
            <select class="select" id="woSelect" data-i18n-aria="filter.woAria"></select>
        </div>
        <button class="btn small" type="button" id="btnAsk" data-i18n="ask.btn"></button>
        <div class="freshness">
            <span id="freshText"></span>
            <button class="btn small ghost refresh-btn" type="button" id="btnRefresh" data-i18n-aria="fresh.refresh" data-i18n-title="fresh.refresh">↻</button>
        </div>
    </header>
    <div class="alert-bar" id="alertBar" role="status" hidden></div>
    </div>

    <div class="content">

    <!-- ─── Trend (the former Dashboard) ─── -->
    <section class="page" id="page-overview" hidden>
        <div class="ov-numbers" data-ov-view="trend">
            <div class="ov-split">
                <div class="label" data-i18n="ov.split"></div>
                <div class="ov-split-body">
                    <div class="ov-split-chart"><canvas id="chOvSplit"></canvas></div>
                    <div class="ov-split-legend" id="ovSplitLegend"></div>
                </div>
            </div>
            <div class="ov-hero">
                <div class="label" data-i18n="ov.yield"></div>
                <div class="value" id="ovYield">—</div>
                <div class="aligned" id="ovPlan"></div>
            </div>
            <div class="ov-num"><div class="label" data-i18n="ov.units"></div><div class="value" id="ovUnits">—</div><div class="sub" id="ovUnitsSub"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.pass"></div><div class="value v-pass" id="ovPass">—</div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.fail"></div><div class="value v-fail" id="ovFail">—</div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.retry"></div><div class="value" id="ovRetry">—</div><div class="sub" id="ovRetrySub"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.avg24"></div><div class="value" id="ovAvg24">—</div><div class="sub" data-i18n="ov.mbps"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.avg5"></div><div class="value" id="ovAvg5">—</div><div class="sub" data-i18n="ov.mbps"></div></div>
        </div>
        <div class="ov-charts" data-ov-view="trend">
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.trend"></div><div class="card-note" id="ovTrendNote"></div></div><div class="chart-box"><canvas id="chOvTrend"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.hourly"></div><div class="card-note" id="ovHourlyNote"></div></div><div class="chart-box"><canvas id="chOvHourly"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.monthly"></div><div class="card-note" id="ovMonthlyNote"></div></div><div class="chart-box"><canvas id="chOvMonthly"></canvas></div></div>
            <div class="card">
                <div class="card-head"><div class="card-title" data-i18n="ov.throughput"></div><div class="card-note" data-i18n="ov.throughputNote"></div></div>
                <div class="chart-pair">
                    <div><div class="chart-sub" data-i18n="rf.band24"></div><div class="chart-box"><canvas id="chOvTp24"></canvas></div></div>
                    <div><div class="chart-sub" data-i18n="rf.band5"></div><div class="chart-box"><canvas id="chOvTp5"></canvas></div></div>
                </div>
            </div>
        </div>
        <!-- Forecast view (#overview?view=forecast): a work order's completion, or this week's / month's output -->
        <div class="fc-note" id="fcNote" data-ov-view="forecast" hidden></div>
        <div class="fc-numbers" data-ov-view="forecast" hidden>
            <div class="td-num" id="fc1"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
            <div class="td-num" id="fc2"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
            <div class="td-num" id="fc3"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
            <div class="td-num" id="fc4"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
            <div class="td-num" id="fc5"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
            <div class="td-num" id="fc6"><div class="label"></div><div class="value">—</div><div class="sub"></div></div>
        </div>
        <div class="fc-charts" data-ov-view="forecast" hidden>
            <div class="card"><div class="card-head"><div class="card-title" id="fcChart1Title"></div><div class="card-note" id="fcChart1Note"></div></div><div class="chart-box"><canvas id="chFc1"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" id="fcChart2Title"></div><div class="card-note" id="fcChart2Note"></div></div><div class="chart-box"><canvas id="chFc2"></canvas></div></div>
        </div>
    </section>

    <!-- ─── Work Orders ─── -->
    <section class="page" id="page-workorders" hidden>
        <div class="card">
            <div class="toolbar mb">
                <input class="input" type="search" id="woSearch" data-i18n-placeholder="wo.searchPh" data-i18n-aria="common.search">
                <div class="seg" role="group" id="woColsSeg" data-i18n-aria="wo.colsAria">
                    <button type="button" data-cols="basic" data-i18n="wo.cols.basic"></button>
                    <button type="button" data-cols="all" data-i18n="wo.cols.all"></button>
                </div>
                <button class="btn small" type="button" id="btnWoCompare" disabled></button>
                <span class="spacer"></span>
                <span class="muted" id="woCount"></span>
            </div>
            <div class="table-wrap scroll">
                <table class="wo-table">
                    <thead id="woHead"></thead>
                    <tbody id="woRows"></tbody>
                </table>
            </div>
            <p class="muted small-text mt-s" data-i18n="wo.statusNote"></p>
        </div>
    </section>

    <!-- ─── Fail List ─── -->
    <section class="page" id="page-fails" hidden>
        <div class="tiles" id="flTiles"></div>
        <div class="card">
            <div class="toolbar mb">
                <div class="seg" role="group" id="flDispSeg" data-i18n-aria="fails.dispAria">
                    <button type="button" data-disp="pending" data-i18n="fails.view.pending"></button>
                    <button type="button" data-disp="handled" data-i18n="fails.view.handled"></button>
                    <button type="button" data-disp="" data-i18n="fails.view.all"></button>
                </div>
                <input class="input" type="search" id="failSearch" data-i18n-placeholder="fails.searchPh" data-i18n-aria="common.search">
                <span class="spacer"></span>
                <span class="muted" id="failCount"></span>
            </div>
            <div class="table-wrap scroll">
                <table>
                    <thead><tr>
                        <th data-i18n="fails.col.time"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th>
                        <th>SN</th><th data-i18n="fails.col.category"></th>
                        <th data-i18n="fails.col.next"></th><th data-i18n="fails.col.disp"></th>
                        <th data-i18n="fails.col.retest"></th><th data-i18n="fails.col.station"></th>
                        <th class="num" data-i18n="fails.col.tp24"></th><th class="num" data-i18n="fails.col.tp5"></th><th data-i18n="fails.col.log"></th>
                    </tr></thead>
                    <tbody id="failRows"></tbody>
                </table>
            </div>
            <div class="pager" id="failPager"></div>
        </div>
    </section>

    <!-- ─── RF Analysis ─── -->
    <section class="page" id="page-rf" hidden>
        <div class="toolbar">
            <div class="tabs" role="tablist" data-i18n-aria="rf.tabAria">
                <button class="tab" role="tab" type="button" data-rf-tab="24g" aria-selected="true" data-i18n="rf.band24"></button>
                <button class="tab" role="tab" type="button" data-rf-tab="5g" aria-selected="false" data-i18n="rf.band5"></button>
                <button class="tab" role="tab" type="button" data-rf-tab="bt" aria-selected="false" data-i18n="rf.bt"></button>
            </div>
            <span class="spacer"></span>
            <span class="muted" id="rfNote"></span>
        </div>
        <div data-rf-view="24g">
            <div class="tiles" id="rfTiles24"></div>
            <div class="grid cols-2">
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.trend"></div><div class="card-note" id="rfTrendNote24"></div></div><div class="chart-box tall"><canvas id="chRfTrend24"></canvas></div></div>
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.dist"></div><div class="card-note" data-i18n="rf.distNote24"></div></div><div class="chart-box tall"><canvas id="chRfDist24"></canvas></div></div>
            </div>
        </div>
        <div data-rf-view="5g" hidden>
            <div class="tiles" id="rfTiles5"></div>
            <div class="grid cols-2">
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.trend"></div><div class="card-note" id="rfTrendNote5"></div></div><div class="chart-box tall"><canvas id="chRfTrend5"></canvas></div></div>
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.dist"></div><div class="card-note" data-i18n="rf.distNote5"></div></div><div class="chart-box tall"><canvas id="chRfDist5"></canvas></div></div>
            </div>
            <div class="card">
                <div class="card-head"><div class="card-title" data-i18n="rf.stdTop"></div><div class="card-note" data-i18n="rf.stdTopNote"></div></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>SN</th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th data-i18n="fails.col.time"></th>
                            <th class="num" data-i18n="rf.col.avg5"></th><th class="num" data-i18n="rf.col.std5"></th>
                            <th class="num" data-i18n="rf.col.std24"></th><th class="num" data-i18n="fails.col.rssi5"></th>
                        </tr></thead>
                        <tbody id="rfStdRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div data-rf-view="bt" hidden>
            <div class="tiles" id="rfTilesBt"></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.btDist"></div><div class="card-note" data-i18n="rf.btDistNote"></div></div><div class="chart-box tall"><canvas id="chRfBt"></canvas></div></div>
        </div>
    </section>

    <!-- ─── Production ─── -->
    <section class="page" id="page-production" hidden>
        <div class="tiles" id="prTiles"></div>
        <div class="grid cols-2">
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="pr.rate"></div><div class="card-note" data-i18n="pr.rateNote"></div></div><div class="chart-box tall"><canvas id="chPrRate"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="pr.dist"></div><div class="card-note" data-i18n="pr.distNote"></div></div><div class="chart-box tall"><canvas id="chPrDist"></canvas></div></div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title" data-i18n="pr.hourly"></div><div class="card-note" id="prHourlyNote"></div></div>
            <div class="chart-box"><canvas id="chPrHourly"></canvas></div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title" data-i18n="pr.table"></div><div class="card-note" id="prCount"></div></div>
            <div class="table-wrap scroll">
                <table>
                    <thead><tr>
                        <th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th data-i18n="pr.col.start"></th><th data-i18n="pr.col.end"></th>
                        <th class="num" data-i18n="pr.col.hours"></th><th class="num" data-i18n="wo.col.units"></th>
                        <th class="num" data-i18n="wo.col.uph"></th><th class="num" data-i18n="pr.col.minPerUnit"></th><th class="num" data-i18n="wo.col.yield"></th>
                    </tr></thead>
                    <tbody id="prRows"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- ─── DB Maintenance (DB Tweak) ─── -->
    <section class="page" id="page-dbtweak" hidden>
        <div class="card login-card" id="twLogin" hidden>
            <h3 data-i18n="tw.loginTitle"></h3>
            <p data-i18n="tw.loginDesc"></p>
            <div class="field"><label for="twUser" data-i18n="common.username"></label><input class="input" id="twUser" autocomplete="username"></div>
            <div class="field"><label for="twPass" data-i18n="common.password"></label><input class="input" type="password" id="twPass" autocomplete="current-password"></div>
            <button class="btn primary full" type="button" id="btnTwLogin" data-i18n="common.signIn"></button>
            <div class="form-msg" id="twLoginMsg" aria-live="polite"></div>
        </div>
        <div class="card" id="twDenied" hidden><div class="state-msg" data-i18n="tw.denied"></div></div>
        <div class="stack" id="twPanel" hidden>
            <div class="notice" data-i18n="tw.intro"></div>
            <div class="tabs" role="tablist">
                <button class="tab" role="tab" type="button" data-tw-tab="records" aria-selected="true" data-i18n="tw.tabRecords"></button>
                <button class="tab" role="tab" type="button" data-tw-tab="batches" aria-selected="false" data-i18n="tw.tabBatches"></button>
            </div>
            <div class="card" data-tw-view="records">
                <div class="toolbar mb">
                    <label class="muted" for="twProduct" data-i18n="wo.col.product"></label>
                    <select class="select" id="twProduct"></select>
                    <label class="muted" for="twWo" data-i18n="wo.col.wo"></label>
                    <select class="select" id="twWo"></select>
                    <label class="muted" for="twLimit" data-i18n="tw.limit"></label>
                    <select class="select" id="twLimit"><option>100</option><option selected>500</option><option>1000</option><option>2000</option></select>
                    <button class="btn small" type="button" id="btnTwReload" data-i18n="fresh.refresh"></button>
                    <button class="btn small" type="button" id="btnTwExport" data-i18n="tw.export"></button>
                    <span class="spacer"></span>
                    <span class="muted" id="twCount"></span>
                    <button class="btn danger" type="button" id="btnTwDeleteWo" data-i18n="tw.deleteWo"></button>
                </div>
                <div class="table-wrap scroll">
                    <table>
                        <thead><tr>
                            <th data-i18n="tw.col.id"></th><th data-i18n="fails.col.time"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th>
                            <th>SN</th><th data-i18n="fails.col.result"></th><th>WiFi</th><th>BT</th>
                            <th class="num" data-i18n="fails.col.tp24"></th><th class="num" data-i18n="fails.col.tp5"></th>
                            <th data-i18n="tw.col.source"></th><th data-i18n="tw.col.upload"></th><th></th>
                        </tr></thead>
                        <tbody id="twRows"></tbody>
                    </table>
                </div>
            </div>
            <div class="card" data-tw-view="batches" hidden>
                <div class="toolbar mb">
                    <span class="muted small-text" data-i18n="tw.batchesNote"></span>
                    <span class="spacer"></span>
                    <button class="btn small" type="button" id="btnTwBatchesReload" data-i18n="fresh.refresh"></button>
                </div>
                <div class="table-wrap scroll">
                    <table>
                        <thead><tr>
                            <th data-i18n="lu.col.time2"></th><th data-i18n="lu.uploader"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th>
                            <th data-i18n="lu.col.source"></th><th data-i18n="lu.col.result"></th><th data-i18n="lu.col.status"></th><th></th>
                        </tr></thead>
                        <tbody id="twBatchRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- ─── Log Upload ─── -->
    <section class="page" id="page-logupload" hidden>
        <div class="card login-card" id="luLogin" hidden>
            <h3 data-i18n="auth.loginTitle"></h3>
            <p data-i18n="auth.loginDesc"></p>
            <div class="field"><label for="luUser" data-i18n="common.username"></label><input class="input" id="luUser" autocomplete="username"></div>
            <div class="field"><label for="luPass" data-i18n="common.password"></label><input class="input" type="password" id="luPass" autocomplete="current-password"></div>
            <button class="btn primary full" type="button" id="btnLuLogin" data-i18n="common.signIn"></button>
            <div class="form-msg" id="luLoginMsg" aria-live="polite"></div>
        </div>
        <div class="card" id="luDenied" hidden><div class="state-msg" data-i18n="lu.deniedRd"></div></div>
        <div class="stack" id="luPanel" hidden>
            <!-- 5D wizard: one step at a time; a finished step folds into one line -->
            <ol class="lu-steps" id="luSteps">
