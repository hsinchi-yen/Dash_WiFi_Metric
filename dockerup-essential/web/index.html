<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi YFP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a84ff'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ETN%3C/text%3E%3C/svg%3E">
<script>
    // Apply the saved theme before first paint (no flash). Dark is the default.
    try { document.documentElement.dataset.theme = localStorage.getItem('wifi-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<script src="vendor/chart.umd-4.4.1.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">

<!-- ═══ Sidebar ═══ -->
<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">TN</div>
        <div>
            <div class="brand-name">WiFi YFP</div>
            <div class="brand-sub" data-i18n="app.sub"></div>
        </div>
    </div>
    <div class="clock">
        <div class="clock-time num" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate"></div>
    </div>
    <nav class="nav" data-i18n-aria="nav.aria">
        <div class="nav-label" data-i18n="nav.groupOverview"></div>
        <a class="nav-item" href="#overview" data-page="overview"><span class="nav-icon">📊</span><span data-i18n="nav.overview"></span></a>
        <a class="nav-item" href="#workorders" data-page="workorders"><span class="nav-icon">📋</span><span data-i18n="nav.workorders"></span></a>
        <a class="nav-item" href="#fails" data-page="fails"><span class="nav-icon">⚠️</span><span data-i18n="nav.fails"></span></a>
        <div class="nav-label" data-i18n="nav.groupAnalysis"></div>
        <a class="nav-item" href="#rf" data-page="rf"><span class="nav-icon">📡</span><span data-i18n="nav.rf"></span></a>
        <a class="nav-item" href="#production" data-page="production"><span class="nav-icon">⚡</span><span data-i18n="nav.production"></span></a>
        <div class="nav-label" data-i18n="nav.groupManage"></div>
        <a class="nav-item" href="#logupload" data-page="logupload"><span class="nav-icon">📤</span><span data-i18n="nav.logupload"></span></a>
        <a class="nav-item" href="#products" data-page="products"><span class="nav-icon">🏷️</span><span data-i18n="nav.products"></span></a>
        <a class="nav-item" href="#dbtweak" data-page="dbtweak" title="DB Tweak"><span class="nav-icon">🔧</span><span data-i18n="nav.dbtweak"></span></a>
        <a class="nav-item" href="#accounts" data-page="accounts" data-admin-only><span class="nav-icon">👥</span><span data-i18n="nav.accounts"></span></a>
    </nav>
    <div class="sidebar-foot">
        <div class="auth-box" id="authBox" hidden>
            <div class="auth-name" id="authName"></div>
            <div class="auth-role" id="authRole"></div>
            <div class="auth-actions">
                <button class="btn small" type="button" id="btnChangePw" data-i18n="auth.changePwBtn"></button>
                <button class="btn small" type="button" id="btnLogout" data-i18n="auth.logout"></button>
            </div>
        </div>
        <div class="prefs">
            <button class="btn small" type="button" id="btnTheme" data-i18n-aria="theme.aria"></button>
            <button class="btn small" type="button" id="btnLang" data-i18n="lang.switch" data-i18n-aria="lang.aria"></button>
        </div>
        <div class="status-row"><span class="dot wait" id="apiDot"></span><span id="apiText" data-i18n="status.api"></span></div>
        <div class="status-row"><span class="dot wait" id="llmDot"></span><span id="llmText" data-i18n="status.llm"></span></div>
    </div>
</aside>

<!-- ═══ Main ═══ -->
<main class="main">
    <header class="topbar">
        <div class="page-head">
            <h1 class="page-title" id="pageTitle"></h1>
            <span class="page-scope" id="pageScope"></span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="filters" id="filterBar" hidden>
            <div class="seg" role="group" id="rangeSeg" data-i18n-aria="filter.rangeAria">
                <button type="button" data-range="all" data-i18n="filter.all"></button>
                <button type="button" data-range="today" data-i18n="filter.today"></button>
                <button type="button" data-range="week" data-i18n="filter.week"></button>
                <button type="button" data-range="month" data-i18n="filter.month"></button>
                <button type="button" data-range="custom" data-i18n="filter.custom"></button>
            </div>
            <span id="customRange" hidden>
                <input type="date" class="input" id="dateFrom" data-i18n-aria="filter.from">
                <span class="muted">~</span>
                <input type="date" class="input" id="dateTo" data-i18n-aria="filter.to">
            </span>
            <select class="select" id="productSelect" data-i18n-aria="filter.productAria"></select>
            <select class="select" id="woSelect" data-i18n-aria="filter.woAria"></select>
        </div>
        <div class="freshness">
            <span id="freshText"></span>
            <button class="btn small ghost" type="button" id="btnRefresh" data-i18n="fresh.refresh"></button>
        </div>
    </header>

    <div class="content">

    <!-- ─── Dashboard ─── -->
    <section class="page" id="page-overview" hidden>
        <div class="ov-numbers">
            <div class="ov-hero">
                <div class="label" data-i18n="ov.yield"></div>
                <div class="value" id="ovYield">—</div>
                <div class="aligned" id="ovPlan"></div>
            </div>
            <div class="ov-num"><div class="label" data-i18n="ov.units"></div><div class="value" id="ovUnits">—</div><div class="sub" id="ovUnitsSub"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.pass"></div><div class="value v-pass" id="ovPass">—</div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.fail"></div><div class="value v-fail" id="ovFail">—</div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.retry"></div><div class="value" id="ovRetry">—</div><div class="sub" id="ovRetrySub"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.avg24"></div><div class="value" id="ovAvg24">—</div><div class="sub" data-i18n="ov.mbps"></div></div>
            <div class="ov-num"><div class="label" data-i18n="ov.avg5"></div><div class="value" id="ovAvg5">—</div><div class="sub" data-i18n="ov.mbps"></div></div>
        </div>
        <div class="ov-charts">
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.trend"></div><div class="card-note" id="ovTrendNote"></div></div><div class="chart-box"><canvas id="chOvTrend"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.split"></div></div><div class="chart-box"><canvas id="chOvSplit"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="ov.monthly"></div><div class="card-note" id="ovMonthlyNote"></div></div><div class="chart-box"><canvas id="chOvMonthly"></canvas></div></div>
            <div class="card">
                <div class="card-head"><div class="card-title" data-i18n="ov.throughput"></div><div class="card-note" data-i18n="ov.throughputNote"></div></div>
                <div class="chart-pair">
                    <div><div class="chart-sub" data-i18n="rf.band24"></div><div class="chart-box"><canvas id="chOvTp24"></canvas></div></div>
                    <div><div class="chart-sub" data-i18n="rf.band5"></div><div class="chart-box"><canvas id="chOvTp5"></canvas></div></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ─── Work Orders ─── -->
    <section class="page" id="page-workorders" hidden>
        <div class="card">
            <div class="toolbar mb">
                <input class="input" type="search" id="woSearch" data-i18n-placeholder="wo.searchPh" data-i18n-aria="common.search">
                <span class="spacer"></span>
                <span class="muted" id="woCount"></span>
            </div>
            <div class="table-wrap scroll">
                <table>
                    <thead><tr>
                        <th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th data-i18n="wo.col.last"></th>
                        <th class="num" data-i18n="wo.col.units"></th><th class="num">PASS</th><th class="num">FAIL</th>
                        <th class="num" data-i18n="wo.col.yield"></th><th class="num" data-i18n="wo.col.retry"></th>
                        <th class="num" data-i18n="wo.col.avg24"></th><th class="num" data-i18n="wo.col.avg5"></th>
                        <th class="num" data-i18n="wo.col.duration"></th><th class="num" data-i18n="wo.col.uph"></th>
                        <th data-i18n="wo.col.report"></th>
                    </tr></thead>
                    <tbody id="woRows"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- ─── Fail List ─── -->
    <section class="page" id="page-fails" hidden>
        <div class="card">
            <div class="toolbar mb">
                <input class="input" type="search" id="failSearch" data-i18n-placeholder="fails.searchPh" data-i18n-aria="common.search">
                <span class="spacer"></span>
                <span class="muted" id="failCount"></span>
            </div>
            <div class="table-wrap scroll">
                <table>
                    <thead><tr>
                        <th data-i18n="fails.col.time"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th>
                        <th>SN</th><th data-i18n="fails.col.mac"></th><th data-i18n="fails.col.reason"></th>
                        <th class="num" data-i18n="fails.col.tp24"></th><th class="num" data-i18n="fails.col.tp5"></th>
                        <th class="num" data-i18n="fails.col.rssi5"></th><th class="num" data-i18n="fails.col.runs"></th><th data-i18n="fails.col.log"></th>
                    </tr></thead>
                    <tbody id="failRows"></tbody>
                </table>
            </div>
            <div class="pager" id="failPager"></div>
        </div>
    </section>

    <!-- ─── RF Analysis ─── -->
    <section class="page" id="page-rf" hidden>
        <div class="toolbar">
            <div class="tabs" role="tablist" data-i18n-aria="rf.tabAria">
                <button class="tab" role="tab" type="button" data-rf-tab="24g" aria-selected="true" data-i18n="rf.band24"></button>
                <button class="tab" role="tab" type="button" data-rf-tab="5g" aria-selected="false" data-i18n="rf.band5"></button>
                <button class="tab" role="tab" type="button" data-rf-tab="bt" aria-selected="false" data-i18n="rf.bt"></button>
            </div>
            <span class="spacer"></span>
            <span class="muted" id="rfNote"></span>
        </div>
        <div data-rf-view="24g">
            <div class="tiles" id="rfTiles24"></div>
            <div class="grid cols-2">
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.trend"></div><div class="card-note" id="rfTrendNote24"></div></div><div class="chart-box tall"><canvas id="chRfTrend24"></canvas></div></div>
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.dist"></div><div class="card-note" data-i18n="rf.distNote24"></div></div><div class="chart-box tall"><canvas id="chRfDist24"></canvas></div></div>
            </div>
        </div>
        <div data-rf-view="5g" hidden>
            <div class="tiles" id="rfTiles5"></div>
            <div class="grid cols-2">
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.trend"></div><div class="card-note" id="rfTrendNote5"></div></div><div class="chart-box tall"><canvas id="chRfTrend5"></canvas></div></div>
                <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.dist"></div><div class="card-note" data-i18n="rf.distNote5"></div></div><div class="chart-box tall"><canvas id="chRfDist5"></canvas></div></div>
            </div>
            <div class="card">
                <div class="card-head"><div class="card-title" data-i18n="rf.stdTop"></div><div class="card-note" data-i18n="rf.stdTopNote"></div></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>SN</th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th data-i18n="fails.col.time"></th>
                            <th class="num" data-i18n="rf.col.avg5"></th><th class="num" data-i18n="rf.col.std5"></th>
                            <th class="num" data-i18n="rf.col.std24"></th><th class="num" data-i18n="fails.col.rssi5"></th>
                        </tr></thead>
                        <tbody id="rfStdRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div data-rf-view="bt" hidden>
            <div class="tiles" id="rfTilesBt"></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="rf.btDist"></div><div class="card-note" data-i18n="rf.btDistNote"></div></div><div class="chart-box tall"><canvas id="chRfBt"></canvas></div></div>
        </div>
    </section>

    <!-- ─── Production ─── -->
    <section class="page" id="page-production" hidden>
        <div class="tiles" id="prTiles"></div>
        <div class="grid cols-2">
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="pr.rate"></div><div class="card-note" data-i18n="pr.rateNote"></div></div><div class="chart-box tall"><canvas id="chPrRate"></canvas></div></div>
            <div class="card"><div class="card-head"><div class="card-title" data-i18n="pr.dist"></div><div class="card-note" data-i18n="pr.distNote"></div></div><div class="chart-box tall"><canvas id="chPrDist"></canvas></div></div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title" data-i18n="pr.hourly"></div><div class="card-note" id="prHourlyNote"></div></div>
            <div class="chart-box"><canvas id="chPrHourly"></canvas></div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title" data-i18n="pr.table"></div><div class="card-note" id="prCount"></div></div>
            <div class="table-wrap scroll">
                <table>
                    <thead><tr>
                        <th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th data-i18n="pr.col.start"></th><th data-i18n="pr.col.end"></th>
                        <th class="num" data-i18n="pr.col.hours"></th><th class="num" data-i18n="wo.col.units"></th>
                        <th class="num" data-i18n="wo.col.uph"></th><th class="num" data-i18n="pr.col.minPerUnit"></th><th class="num" data-i18n="wo.col.yield"></th>
                    </tr></thead>
                    <tbody id="prRows"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- ─── DB Maintenance (DB Tweak) ─── -->
    <section class="page" id="page-dbtweak" hidden>
        <div class="card login-card" id="twLogin" hidden>
            <h3 data-i18n="tw.loginTitle"></h3>
            <p data-i18n="tw.loginDesc"></p>
            <div class="field"><label for="twUser" data-i18n="common.username"></label><input class="input" id="twUser" autocomplete="username"></div>
            <div class="field"><label for="twPass" data-i18n="common.password"></label><input class="input" type="password" id="twPass" autocomplete="current-password"></div>
            <button class="btn primary full" type="button" id="btnTwLogin" data-i18n="common.signIn"></button>
            <div class="form-msg" id="twLoginMsg" aria-live="polite"></div>
        </div>
        <div class="card" id="twDenied" hidden><div class="state-msg" data-i18n="tw.denied"></div></div>
        <div class="stack" id="twPanel" hidden>
            <div class="notice" data-i18n="tw.intro"></div>
            <div class="card">
                <div class="toolbar mb">
                    <label class="muted" for="twProduct" data-i18n="wo.col.product"></label>
                    <select class="select" id="twProduct"></select>
                    <label class="muted" for="twWo" data-i18n="wo.col.wo"></label>
                    <select class="select" id="twWo"></select>
                    <label class="muted" for="twLimit" data-i18n="tw.limit"></label>
                    <select class="select" id="twLimit"><option>100</option><option selected>500</option><option>1000</option><option>2000</option></select>
                    <button class="btn small" type="button" id="btnTwReload" data-i18n="fresh.refresh"></button>
                    <span class="spacer"></span>
                    <span class="muted" id="twCount"></span>
                    <button class="btn danger" type="button" id="btnTwDeleteWo" data-i18n="tw.deleteWo"></button>
                </div>
                <div class="table-wrap scroll">
                    <table>
                        <thead><tr>
                            <th data-i18n="tw.col.id"></th><th data-i18n="fails.col.time"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th>
                            <th>SN</th><th data-i18n="fails.col.result"></th><th>WiFi</th><th>BT</th>
                            <th class="num" data-i18n="fails.col.tp24"></th><th class="num" data-i18n="fails.col.tp5"></th>
                            <th data-i18n="tw.col.source"></th><th data-i18n="tw.col.upload"></th><th data-i18n="tw.col.actions"></th>
                        </tr></thead>
                        <tbody id="twRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- ─── Log Upload ─── -->
    <section class="page" id="page-logupload" hidden>
        <div class="card login-card" id="luLogin" hidden>
            <h3 data-i18n="auth.loginTitle"></h3>
            <p data-i18n="auth.loginDesc"></p>
            <div class="field"><label for="luUser" data-i18n="common.username"></label><input class="input" id="luUser" autocomplete="username"></div>
            <div class="field"><label for="luPass" data-i18n="common.password"></label><input class="input" type="password" id="luPass" autocomplete="current-password"></div>
            <button class="btn primary full" type="button" id="btnLuLogin" data-i18n="common.signIn"></button>
            <div class="form-msg" id="luLoginMsg" aria-live="polite"></div>
        </div>
        <div class="stack" id="luPanel" hidden>
            <div class="notice" data-i18n="lu.howto"></div>
            <div class="card">
                <div class="card-title mb"><span class="lu-num">1</span><span data-i18n="lu.step1"></span></div>
                <div class="lu-sources">
                    <div class="drop" id="luDrop" tabindex="0" role="button" data-i18n-aria="lu.dropAria">
                        <input type="file" id="luFile" accept=".zip,application/zip" hidden>
                        <div data-i18n="lu.drop"></div>
                        <div class="muted num" id="luFileInfo" data-i18n="lu.noFile"></div>
                    </div>
                    <div class="lu-or">
                        <input type="file" id="luFolder" webkitdirectory directory multiple hidden>
                        <button class="btn" type="button" id="btnLuFolder" data-i18n="lu.folder"></button>
                    </div>
                </div>
                <div class="status-line" id="luAnalyzeStatus" aria-live="polite"></div>
                <div id="luFacts" hidden>
                    <div class="tiles my" id="luFactGrid"></div>
                    <div class="notice warn" id="luInferred" hidden></div>
                    <details id="luIgnoredBox" hidden>
                        <summary id="luIgnoredSummary"></summary>
                        <div class="table-wrap mt-s detail-table">
                            <table>
                                <thead><tr><th data-i18n="lu.col.file"></th><th data-i18n="lu.col.reason"></th></tr></thead>
                                <tbody id="luIgnoredRows"></tbody>
                            </table>
                        </div>
                    </details>
                </div>
            </div>

            <div class="card" id="luStepConfirm" hidden>
                <div class="card-title mb"><span class="lu-num">2</span><span data-i18n="lu.step2"></span></div>
                <div class="toolbar mb">
                    <strong id="luModeLabel"></strong>
                    <span class="muted" id="luModeHint"></span>
                    <span class="spacer"></span>
                    <button class="btn small" type="button" id="btnLuMode" hidden></button>
                </div>
                <div id="luChatPanel" hidden>
                    <div class="chat">
                        <div class="chat-log" id="luChatLog" aria-live="polite"></div>
                        <div class="chips chat-chips" id="luChips" hidden></div>
                        <div class="chat-input">
                            <input class="input" id="luChatInput" maxlength="500" autocomplete="off" data-i18n-placeholder="lu.chatPh">
                            <button class="btn primary" type="button" id="btnLuChatSend" data-i18n="lu.send"></button>
                        </div>
                    </div>
                    <div class="muted num my" id="luExtract"></div>
                </div>
                <div class="form-grid" id="luFormPanel">
                    <div class="field">
                        <label for="luProduct"><span data-i18n="lu.product"></span> *</label>
                        <select class="select" id="luProduct"></select>
                        <input class="input" id="luProductNew" autocomplete="off" spellcheck="false" data-i18n-placeholder="lu.productNewPh" hidden>
                    </div>
                    <div class="field"><label for="luWo"><span data-i18n="lu.wo"></span> *</label><input class="input" id="luWo" autocomplete="off" spellcheck="false"><div class="field-hint" data-i18n="lu.woHint"></div></div>
                    <div class="field"><label for="luQty"><span data-i18n="lu.qty"></span> *</label><input class="input" id="luQty" inputmode="numeric" autocomplete="off" data-i18n-placeholder="lu.qtyPh"></div>
                </div>
                <ul class="issues" id="luIssues" aria-live="polite"></ul>
                <div id="luAlign" hidden>
                    <div class="muted small-text mb-s" data-i18n="lu.align"></div>
                    <div class="tiles mb" id="luAlignGrid"></div>
                </div>
                <label class="ack" id="luAckRow" hidden><input type="checkbox" id="luAck"> <span data-i18n="lu.ack"></span></label>
                <div class="toolbar">
                    <button class="btn primary" type="button" id="btnLuUpload" data-i18n="lu.upload" disabled></button>
                    <button class="btn" type="button" id="btnLuReset" data-i18n="lu.reset"></button>
                </div>
            </div>

            <div class="card" id="luStepProgress" hidden>
                <div class="card-title mb"><span class="lu-num">3</span><span data-i18n="lu.step3"></span></div>
                <div class="progress"><div id="luProgressFill"></div></div>
                <div class="toolbar">
                    <div class="status-line" id="luProgressText" aria-live="polite"></div>
                    <span class="spacer"></span>
                    <button class="btn small danger" type="button" id="btnLuCancel" data-i18n="lu.cancel" hidden></button>
                </div>
                <div class="tiles mt" id="luResultGrid" hidden></div>
                <div class="muted small-text mt-s" id="luResultNote"></div>
                <details id="luFailureBox" hidden>
                    <summary id="luFailureSummary"></summary>
                    <div class="table-wrap mt-s detail-table">
                        <table>
                            <thead><tr><th data-i18n="lu.col.file"></th><th data-i18n="lu.col.error"></th></tr></thead>
                            <tbody id="luFailureRows"></tbody>
                        </table>
                    </div>
                </details>
                <div class="toolbar mt" id="luItemsRow" hidden>
                    <button class="btn small" type="button" id="btnLuItemsCsv" data-i18n="lu.items.csv"></button>
                    <button class="btn small" type="button" id="btnLuItemsTxt" data-i18n="lu.items.txt"></button>
                </div>
                <div class="toolbar mt">
                    <button class="btn" type="button" id="btnLuNext" data-i18n="lu.next" hidden></button>
                    <button class="btn danger" type="button" id="btnLuRevert" data-i18n="lu.revert" hidden></button>
                </div>
            </div>

            <div class="card">
                <div class="toolbar mb">
                    <div class="card-title" id="luHistoryTitle"></div>
                    <span class="spacer"></span>
                    <label class="muted" for="luHistoryUser" id="luHistoryFilterLabel" data-i18n="lu.uploader" hidden></label>
                    <select class="select" id="luHistoryUser" hidden></select>
                    <button class="btn small" type="button" id="btnLuHistoryRefresh" data-i18n="lu.refresh"></button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th data-i18n="lu.col.time2"></th><th data-i18n="wo.col.wo"></th><th data-i18n="wo.col.product"></th><th class="num" data-i18n="lu.col.planned"></th>
                            <th data-i18n="lu.col.source"></th><th class="num" data-i18n="lu.col.new"></th><th class="num" data-i18n="lu.col.skip"></th>
                            <th class="num" data-i18n="lu.col.fail"></th><th data-i18n="lu.col.status"></th><th data-i18n="lu.uploader"></th><th></th>
                        </tr></thead>
                        <tbody id="luHistoryRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- ─── Product registry ─── -->
    <section class="page" id="page-products" hidden>
        <div class="card login-card" id="prodLogin" hidden>
            <h3 data-i18n="auth.loginTitle"></h3>
            <p data-i18n="auth.loginDesc"></p>
            <div class="field"><label for="prodUser" data-i18n="common.username"></label><input class="input" id="prodUser" autocomplete="username"></div>
            <div class="field"><label for="prodPass" data-i18n="common.password"></label><input class="input" type="password" id="prodPass" autocomplete="current-password"></div>
            <button class="btn primary full" type="button" id="btnProdLogin" data-i18n="common.signIn"></button>
            <div class="form-msg" id="prodLoginMsg" aria-live="polite"></div>
        </div>
        <div class="stack" id="prodPanel" hidden>
            <div class="notice" data-i18n="prod.intro"></div>
            <div class="card">
                <div class="toolbar mb">
                    <label class="muted" for="prodCheck" data-i18n="prod.check"></label>
                    <input class="input prod-check" id="prodCheck" autocomplete="off" spellcheck="false" data-i18n-placeholder="prod.checkPh">
                    <span class="spacer"></span>
                    <button class="btn small" type="button" id="btnProdReload" data-i18n="fresh.refresh"></button>
                    <button class="btn primary" type="button" id="btnProdNew" data-i18n="prod.new"></button>
                </div>
                <div class="status-line" id="prodCheckResult" aria-live="polite"></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th data-i18n="prod.col.name"></th><th class="num" data-i18n="prod.col.tn"></th><th class="num" data-i18n="prod.col.units"></th>
                            <th class="num" data-i18n="prod.col.wos"></th><th data-i18n="prod.col.last"></th><th data-i18n="prod.col.status"></th>
                            <th data-i18n="prod.col.source"></th><th data-i18n="prod.col.note"></th><th data-i18n="prod.col.ops"></th>
                        </tr></thead>
                        <tbody id="prodRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- ─── Accounts (administrator) ─── -->
    <section class="page" id="page-accounts" hidden>
        <div class="card" id="acctDenied" hidden><div class="state-msg" data-i18n="acct.denied"></div></div>
        <div class="stack" id="acctPanel" hidden>
            <div class="toolbar mb">
                <div class="tabs" role="tablist">
                    <button class="tab" role="tab" type="button" data-acct-tab="users" aria-selected="true" data-i18n="acct.tabUsers"></button>
                    <button class="tab" role="tab" type="button" data-acct-tab="audit" aria-selected="false" data-i18n="acct.tabAudit"></button>
                    <button class="tab" role="tab" type="button" data-acct-tab="logins" aria-selected="false" data-i18n="acct.tabLogins"></button>
                </div>
                <span class="spacer"></span>
                <button class="btn primary" type="button" id="btnAcctNew" data-i18n="acct.new"></button>
            </div>
            <div data-acct-view="users">
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th data-i18n="acct.col.user"></th><th data-i18n="acct.col.name"></th><th data-i18n="acct.col.dept"></th>
                            <th data-i18n="acct.col.email"></th><th data-i18n="acct.col.state"></th><th class="num" data-i18n="acct.col.uploads"></th>
                            <th class="num" data-i18n="acct.col.rows"></th><th class="num" data-i18n="acct.col.reverted"></th>
                            <th data-i18n="acct.col.lastUpload"></th><th data-i18n="acct.col.lastLogin"></th><th data-i18n="acct.col.ops"></th>
                        </tr></thead>
                        <tbody id="acctUserRows"></tbody>
                    </table>
                </div>
                <p class="muted mt-s small-text" data-i18n="acct.note"></p>
            </div>
            <div data-acct-view="audit" hidden>
                <div class="toolbar mb">
                    <label class="muted" for="acctAuditUser" data-i18n="acct.filterUser"></label>
                    <select class="select" id="acctAuditUser"></select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th data-i18n="acct.col.time"></th><th data-i18n="acct.col.actor"></th><th data-i18n="acct.col.action"></th><th data-i18n="acct.col.target"></th><th data-i18n="acct.col.detail"></th><th data-i18n="acct.col.ip"></th></tr></thead>
                        <tbody id="acctAuditRows"></tbody>
                    </table>
                </div>
                <div class="pager" id="acctAuditPager"></div>
            </div>
            <div data-acct-view="logins" hidden>
                <div class="toolbar mb">
                    <label class="muted" for="acctLoginUser" data-i18n="acct.filterUser"></label>
                    <select class="select" id="acctLoginUser"></select>
                    <label class="muted" for="acctLoginResult" data-i18n="acct.filterResult"></label>
                    <select class="select" id="acctLoginResult">
                        <option value="" data-i18n="common.all"></option>
                        <option value="true" data-i18n="common.success"></option>
                        <option value="false" data-i18n="common.failed"></option>
                    </select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th data-i18n="acct.col.time"></th><th data-i18n="acct.col.user"></th><th data-i18n="acct.col.event"></th><th data-i18n="acct.col.result"></th><th data-i18n="acct.col.reason"></th><th data-i18n="acct.col.ip"></th><th data-i18n="acct.col.agent"></th></tr></thead>
                        <tbody id="acctLoginRows"></tbody>
                    </table>
                </div>
                <div class="pager" id="acctLoginPager"></div>
            </div>
        </div>
    </section>

    </div>
</main>
</div>

<!-- ═══ AI report ═══ -->
<div class="modal" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="rpTitle" hidden>
    <div class="modal-panel wide">
        <div class="modal-head">
            <div class="modal-title" id="rpTitle"></div>
            <span class="muted" id="rpGenerated"></span>
            <div class="seg" role="group" id="rpLang" data-i18n-aria="rp.langAria">
                <button type="button" data-lang="zh" aria-pressed="true" data-i18n="rp.zh"></button>
                <button type="button" data-lang="en" aria-pressed="false" data-i18n="rp.en"></button>
            </div>
            <button class="btn small" type="button" id="btnRpCopy" data-i18n="rp.copy"></button>
            <button class="btn small" type="button" id="btnRpDownload" data-i18n="rp.download"></button>
            <button class="btn small" type="button" id="btnRpRegen" data-i18n="rp.regen"></button>
            <button class="icon-btn" type="button" id="btnRpClose" data-i18n-aria="common.close">×</button>
        </div>
        <div class="modal-body">
            <div id="rpBanner"></div>
            <div class="rp-facts" id="rpFacts"></div>
            <div class="rp-text" id="rpBody"></div>
        </div>
    </div>
</div>

<!-- ═══ Form dialog ═══ -->
<div class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="formModalTitle" hidden>
    <form class="modal-panel" id="formModalForm" novalidate>
        <div class="modal-head"><div class="modal-title" id="formModalTitle"></div></div>
        <div class="modal-body">
            <p class="muted mb" id="formModalDesc"></p>
            <div id="formModalFields"></div>
            <div class="form-msg" id="formModalMsg" aria-live="polite"></div>
        </div>
        <div class="modal-foot">
            <button class="btn" type="button" id="btnFormModalCancel" data-i18n="common.cancel"></button>
            <button class="btn primary" type="submit" id="btnFormModalSubmit"></button>
        </div>
    </form>
</div>
</body>
</html>
